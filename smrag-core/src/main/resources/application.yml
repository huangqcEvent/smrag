server:
  port: 8080

spring:
  application:
    name: smrag

  mvc:
    async:
      request-timeout: 105s

  datasource:
    url: jdbc:postgresql://localhost:5432/smrag
    username: postgres
    password: ${SMRAG_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: smrag-parse-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

    vectorstore:
      pgvector:
        table-name: rag_vector_store
        dimensions: 1536
        index-type: hnsw
        distance-type: cosine-distance
        initialize-schema: false
        schema-validation: true

    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        api-key: ${DASHSCOPE_API_KEY}
        options:
          model: qwen-plus
      embedding:
        api-key: ${DASHSCOPE_API_KEY}
        options:
          model: text-embedding-v2

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.hqc.smrag: DEBUG

smrag:
  storage:
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: ${SMRAG_MINIO_ACCESS_KEY}
      secret-key: ${SMRAG_MINIO_SECRET_KEY}
      bucket-name: ${prefix.distinction.name:super-agent}-document
      object-prefix: rag/document
      parsed-text-prefix: rag/parsed-text
  security:
    jwt:
      secret-key: ${SMRAG_JWT_SECRET_KEY}
      access-token-expiration: 7200000  # 2 hours
      refresh-token-expiration: 604800000  # 7 days
  ai:
    chat:
      stream:
        timeout: 90s
    rag:
      top-k: 8
      similarity-threshold: 0.40
      max-context-documents: 5
      memory-window: 12
      chunk-size: 800
      min-chunk-size-chars: 350
      min-chunk-length-to-embed: 20
      max-num-chunks: 5000
      keep-separator: true
      recursive-chunk-size: 800
      recursive-chunk-overlap: 120
      recursive-separators:
        - "\n\n"
        - "\n"
        - "。"
        - "！"
        - "？"
        - "；"
        - "，"
        - " "
      max-upload-size-bytes: 20971520
      reindex-on-startup: false
